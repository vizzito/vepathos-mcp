name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Lint
        run: |
          ruff check src tests devtools
          ruff format --check src tests devtools
      - name: Type check
        run: mypy src
      - name: Tests (unit, contract, protocol)
        run: pytest
      - name: Dependency audit
        run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vepathos-mcp:ci .
      - name: Smoke test container
        run: |
          docker run -d --name mcp -p 8080:8080 \
            -e ENVIRONMENT=development \
            -e VEPATHOS_MCP_SERVICE_KEY=ci \
            -e AUTH_MODES=api_key \
            vepathos-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)" = "401"
